<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="scamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d1f"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#scamBg)"/>

  <!-- Radar Grid Background -->
  <g stroke="rgba(244,63,94,0.06)" stroke-width="1">
    <circle cx="400" cy="225" r="80" fill="none"/>
    <circle cx="400" cy="225" r="160" fill="none"/>
    <circle cx="400" cy="225" r="240" fill="none"/>
    <line x1="160" y1="225" x2="640" y2="225"/>
    <line x1="400" y1="65" x2="400" y2="385"/>
  </g>

  <!-- Main Container Card -->
  <rect x="50" y="45" width="700" height="360" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="50" y="45" width="700" height="42" rx="16" fill="rgba(255, 255, 255, 0.03)"/>
  <circle cx="75" cy="66" r="5" fill="#ef4444"/>
  <circle cx="95" cy="66" r="5" fill="#eab308"/>
  <circle cx="115" cy="66" r="5" fill="#22c55e"/>
  <text x="145" y="71" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1">ScamHunter.ai // AI Threat Intel &amp; EasyOCR Forensics</text>
  
  <rect x="610" y="56" width="125" height="20" rx="10" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.4)"/>
  <circle cx="622" cy="66" r="3" fill="#ef4444"/>
  <text x="632" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f87171">THREAT ALERT</text>

  <!-- Left: EasyOCR Visual Forensics Scanning Box -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="360" height="260" rx="10" fill="#030712" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Uploaded Screenshot Preview Simulation -->
    <rect x="15" y="15" width="330" height="150" rx="6" fill="#1e1e2f"/>
    <!-- Mock Scam Message -->
    <text x="25" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#f8fafc" font-weight="bold">URGENT: BANK ACCOUNT SUSPENDED</text>
    <text x="25" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">Click link to verify KYC within 24 hours:</text>
    <text x="25" y="80" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">http://secure-bank-login-verify.xyz/auth</text>
    
    <!-- OCR Bounding Boxes -->
    <rect x="22" y="68" width="280" height="18" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="225" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444">[EasyOCR: Malicious URL]</text>

    <!-- Scan Line -->
    <line x1="15" y1="75" x2="345" y2="75" stroke="#f43f5e" stroke-width="2" opacity="0.8"/>

    <!-- Terminal Output -->
    <rect x="15" y="180" width="330" height="68" rx="6" fill="rgba(0,0,0,0.5)"/>
    <g transform="translate(25, 198)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">
      <text y="0"><tspan fill="#f43f5e">[!]</tspan> VirusTotal API: 14/89 Security Vendors Flagged Malicious</text>
      <text y="18"><tspan fill="#eab308">[!]</tspan> URLScan Threat Score: High (Newly Registered Domain)</text>
      <text y="36"><tspan fill="#38bdf8">[i]</tspan> Groq Llama 3: Fraudulent Banking Phishing Signature</text>
    </g>
  </g>

  <!-- Right: Dynamic Risk Score & Explainer -->
  <g transform="translate(470, 110)">
    <!-- Risk Score Dial Card -->
    <rect x="0" y="0" width="250" height="120" rx="10" fill="rgba(5, 8, 17, 0.7)" stroke="rgba(244, 63, 94, 0.3)"/>
    <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">DYNAMIC RISK RATING</text>
    <text x="20" y="68" font-family="'Space Grotesk', sans-serif" font-size="42" font-weight="bold" fill="#ef4444">92<tspan font-size="20" fill="#94a3b8">/100</tspan></text>
    <text x="20" y="92" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f87171">CRITICAL PHISHING RISK</text>

    <!-- Report Generation Card -->
    <rect x="0" y="135" width="250" height="135" rx="10" fill="rgba(5, 8, 17, 0.7)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="20" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Automated PDF Dossier</text>
    <text x="20" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">ReportLab forensic summary</text>
    <text x="20" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">ready for security audit export.</text>
    <rect x="20" y="215" width="210" height="32" rx="6" fill="rgba(244, 63, 94, 0.15)" stroke="rgba(244, 63, 94, 0.4)"/>
    <text x="50" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#fb7185">📄 Forensic_Audit.pdf</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="50" y="398" width="700" height="7" rx="3" fill="url(#alertGrad)"/>
</svg>
