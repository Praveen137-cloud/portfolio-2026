<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400"/>
    <path d="M 100,0 L 100,450 M 200,0 L 200,450 M 300,0 L 300,450 M 400,0 L 400,450 M 500,0 L 500,450 M 600,0 L 600,450 M 700,0 L 700,450"/>
  </g>

  <!-- Floating Glow Orbs -->
  <circle cx="160" cy="180" r="120" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>
  <circle cx="680" cy="300" r="140" fill="#8b5cf6" opacity="0.1" filter="url(#glow)"/>

  <!-- Main Dashboard Card -->
  <rect x="50" y="45" width="700" height="360" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5"/>

  <!-- Card Top Bar -->
  <rect x="50" y="45" width="700" height="42" rx="16" fill="rgba(255, 255, 255, 0.03)"/>
  <circle cx="75" cy="66" r="5" fill="#ef4444"/>
  <circle cx="95" cy="66" r="5" fill="#eab308"/>
  <circle cx="115" cy="66" r="5" fill="#22c55e"/>
  <text x="145" y="71" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94a3b8">SEOAgent.ai // Autonomous Diagnostic Engine</text>
  <rect x="630" y="56" width="105" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)"/>
  <circle cx="642" cy="66" r="3" fill="#10b981"/>
  <text x="652" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#10b981">LIVE AGENT</text>

  <!-- Left: 0-100 Gauge Meter -->
  <g transform="translate(180, 225)">
    <!-- Outer ring background -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/>
    <!-- Animated fill ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-dasharray="471" stroke-dashoffset="65" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="-8" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">96</text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#10b981" font-weight="600" text-anchor="middle">SEO HEALTH</text>
    <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">0 - 100 ENGINE</text>
  </g>

  <!-- Middle: Crawl Stats & Metrics -->
  <g transform="translate(320, 115)">
    <!-- Stat Box 1 -->
    <rect x="0" y="0" width="180" height="65" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">CRAWLED PAGES</text>
    <text x="16" y="50" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold" fill="#38bdf8">148 URLs</text>
    <path d="M 140,42 L 148,32 L 156,36 L 168,22" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Stat Box 2 -->
    <rect x="200" y="0" width="180" height="65" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="216" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">GROQ LLM (LLAMA 3)</text>
    <text x="216" y="50" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold" fill="#c084fc">480 ms</text>
    <text x="340" y="48" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">⚡ Fast</text>

    <!-- AI Diagnostic Log Box -->
    <rect x="0" y="80" width="380" height="180" rx="12" fill="rgba(5, 8, 17, 0.7)" stroke="rgba(6, 182, 212, 0.2)"/>
    <text x="16" y="104" font-family="'JetBrains Mono', monospace" font-size="12" fill="#06b6d4" font-weight="600">⚡ AI Audit Strategy & Recommendations</text>
    
    <g transform="translate(16, 122)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">
      <text y="0"><tspan fill="#10b981">✓</tspan> Canonical tag consistency verified</text>
      <text y="22"><tspan fill="#10b981">✓</tspan> OpenGraph & Twitter Card headers intact</text>
      <text y="44"><tspan fill="#f59e0b">⚠</tspan> LCP metric: 2.8s -> Compress hero webp</text>
      <text y="66"><tspan fill="#38bdf8">ℹ</tspan> Chrome Ext: 1-Click DOM Inspector Active</text>
      <text y="88"><tspan fill="#c084fc">★</tspan> ReportLab: Audit_Executive_Summary.pdf generated</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="50" y="398" width="700" height="7" rx="3" fill="url(#cyanGrad)"/>
</svg>
